name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        # E501 (line too long) excluded on purpose -- this codebase deliberately uses long
        # lines for detailed rationale comments, not a style bug.
        run: ruff check . --select E,F,B --ignore E501

  unit-tests:
    name: Unit tests (pytest, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/

  test:
    name: Functional tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Здесь ffmpeg через choco -- ОК: этот job ничего не распространяет, только гоняет
      # функциональные смоук-тесты CLI. Для сборки распространяемого .exe (job `build` ниже)
      # ffmpeg берётся отдельно из LGPL-сборки BtbN, не из choco (GPL).
      - name: Install external tools (exiftool/ffmpeg/7zip/unrar)
        run: choco install exiftool ffmpeg 7zip unrar -y --no-progress
        shell: pwsh

      - name: Sanity-check tools are on PATH
        shell: pwsh
        run: |
          exiftool -ver
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
          7z i | Select-Object -First 1

      - name: Syntax check
        run: python -m py_compile photosort_win.py

      - name: Run functional smoke tests
        run: python ci/windows_ci_test.py

  build:
    name: Build PhotoArchive.exe
    runs-on: windows-latest
    needs: [lint, unit-tests, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install external tools (exiftool/7zip/unrar)
        run: choco install exiftool 7zip unrar -y --no-progress
        shell: pwsh

      # ffmpeg -- НЕ через choco. Пакет choco `ffmpeg` = сборка gyan.dev "full"
      # (--enable-gpl, x264/x265) => GPL, требует source-offer при распространении бинарника.
      # Политика проекта (bin/README-BIN.md, THIRD_PARTY_LICENSES.md, licenses/ffmpeg/ =
      # только COPYING.LGPLv3) -- LGPL-сборка без GPL-компонентов. Берём LGPL-сборку BtbN
      # (тот же источник, что рекомендуют доки). Версия не пинится намеренно -- как и для
      # остальных bin/-бинарников (bin/README-BIN.md).
      - name: Download LGPL ffmpeg/ffprobe (BtbN build)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg-lgpl.zip -UseBasicParsing
          Expand-Archive ffmpeg-lgpl.zip -DestinationPath ffmpeg-lgpl -Force
          $ffbin = Join-Path (Get-ChildItem ffmpeg-lgpl -Directory | Select-Object -First 1).FullName "bin"
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item (Join-Path $ffbin "ffmpeg.exe")  bin\ffmpeg.exe  -Force
          Copy-Item (Join-Path $ffbin "ffprobe.exe") bin\ffprobe.exe -Force
          $ver = (& bin\ffmpeg.exe -version | Out-String)
          Write-Host $ver
          if ($ver -match "--enable-gpl") { throw "BtbN lgpl build unexpectedly contains --enable-gpl" }

      - name: Assemble the rest of bin/ from choco-installed tools
        shell: pwsh
        run: ./ci/assemble_bin.ps1

      - name: Build PhotoArchive.exe
        shell: cmd
        working-directory: build
        run: build.bat

      - name: Smoke-test the built exe end-to-end
        shell: pwsh
        run: |
          $env:Path = "$PWD\bin;" + $env:Path
          python ci/smoke_test_exe.py

      # No continue-on-error here (third-review finding, 2026-07-17): the release job below
      # downloads this exact artifact on a tag push -- a silently swallowed upload failure
      # would make `build` go green while `release` fails two jobs later on a confusing
      # "artifact not found", instead of failing loudly where the actual problem is. This
      # repo also doesn't have the private repo's tight artifact-storage quota that originally
      # motivated tolerating upload failures, so there's no real hiccup left to protect against.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: PhotoArchive-exe
          path: build/dist/PhotoArchive.exe
          retention-days: 14

      # ZIP-ассет (папка PhotoArchive\ внутри: exe + документация PDF + лицензии + пример
      # конфига, build.bat собирает его сам) -- та же логика "не глотать ошибку загрузки
      # молча", что и у exe-артефакта выше: release job ниже качает оба по имени, тихий сбой
      # здесь всплыл бы там непонятной ошибкой "artifact not found".
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: PhotoArchive-zip
          path: build/dist/PhotoArchive.zip
          retention-days: 14

      # 2026-08-04: та же документация, что уже упакована ВНУТРИ PhotoArchive.zip выше
      # (build.bat уже конвертирует её в PDF через md_to_pdf.py на этом же раннере) --
      # публикуется ЕЩЁ и отдельными файлами релиза, а release-job ниже дополнительно
      # коммитит три из них (QUICKSTART/FAQ/PhotoArchive_ot_avtora) обратно в main для
      # самого сайта (см. шаг "Publish site PDFs to main" -- нужен из-за того, что
      # Release-ассеты GitHub не открываются в браузере, только скачиваются). Это заменило
      # отдельный ручной Windows-шаг (build/gen_doc_pdfs.py, удалён) с независимым от CI
      # источником PDF -- расхождение между PDF на сайте и PDF в ZIP устранено тем, что
      # генерируется PDF теперь только здесь, в одном месте.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: PhotoArchive-docs-pdf
          path: build/dist/*.pdf
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # Нужен реальный checkout main (не только download-artifact) -- следующий шаг ниже
      # коммитит PDF обратно в ветку, а не просто публикует релиз.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: PhotoArchive-exe
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: PhotoArchive-zip
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: PhotoArchive-docs-pdf
          path: dist

      # SHA-256 контрольные суммы для проверки скачанного (third-review B1, Раунды 168/169):
      # обычный пользователь их не сверяет, но релиз без опубликованных сумм не даёт СПОСОБА
      # убедиться, что .exe/.zip не подменён при скачивании. Только .exe и .zip (исполняемый
      # код) -- PDF-документация не в security-периметре. Файл кладётся релиз-ассетом; sha256sum
      # без путей (working-directory) -> `sha256sum -c SHA256SUMS.txt` работает в папке загрузок.
      - name: Generate SHA-256 checksums for release artifacts
        shell: bash
        working-directory: dist
        run: sha256sum PhotoArchive.exe PhotoArchive.zip | tee SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            dist/PhotoArchive.exe
            dist/PhotoArchive.zip
            dist/SHA256SUMS.txt
            dist/*.pdf
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2026-08-05: GitHub Release-ассеты всегда отдаются с Content-Disposition: attachment
      # и Content-Type: application/octet-stream (подтверждено curl -- прибито на стороне
      # GitHub, не лечится атрибутами <a>) -- ссылки "Открыть" на сайте вместо просмотра PDF
      # в браузере предлагали его скачать. Раздать те же три PDF ещё и с самого сайта (GitHub
      # Pages, свой домен -- отдаёт настоящий application/pdf без attachment) чинит это без
      # возврата ко второму независимому источнику PDF: файлы те же самые, из того же
      # CI-артефакта, что и релизный ассет выше, просто дополнительно закоммичены в main.
      - name: Publish site PDFs to main (same-origin hosting for "Открыть" links)
        shell: bash
        run: |
          cp dist/QUICKSTART.pdf QUICKSTART.pdf
          cp dist/FAQ.pdf FAQ.pdf
          cp dist/PhotoArchive_ot_avtora.pdf PhotoArchive_ot_avtora.pdf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add QUICKSTART.pdf FAQ.pdf PhotoArchive_ot_avtora.pdf
          if git diff --cached --quiet; then
            echo "PDFs unchanged, nothing to commit"
          else
            git commit -m "Сайт: обновить PDF-документацию (релиз ${{ github.ref_name }})"
            git push origin main
          fi
